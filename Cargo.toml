[package]
name = "gcpv"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Named Google Cloud profiles backed by the OS keychain"
repository = "https://github.com/hatemosphere/google-cloud-profile-vault"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
google-cloud-auth = "1.15.0"
keyring = "4.1.6"
oauth2 = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
toml = "1.1.4"
url = "2.5.8"
webbrowser = "1.2.4"
zeroize = "1.9.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["process"] }
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
